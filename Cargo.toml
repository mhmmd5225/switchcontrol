[workspace]
resolver = "3"
members = ["app", "crates/core", "crates/keymap", "crates/platform", "crates/proto", "spikes/win-spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
sc-core = { path = "crates/core" }
sc-keymap = { path = "crates/keymap" }
sc-platform = { path = "crates/platform" }
sc-proto = { path = "crates/proto" }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
spake2 = "0.4"
