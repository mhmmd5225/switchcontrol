[package]
name = "switchcontrol"
description = "Share one keyboard and mouse between Windows and macOS"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sc-core.workspace = true
sc-platform.workspace = true
sc-proto.workspace = true
serde.workspace = true
toml.workspace = true
rcgen.workspace = true
ring.workspace = true
rustls.workspace = true
spake2.workspace = true
eframe = "0.37"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry"]

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
