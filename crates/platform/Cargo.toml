[package]
name = "sc-platform"
description = "Capture physical input and inject synthetic input (Windows, macOS)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sc-keymap.workspace = true
sc-proto.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
