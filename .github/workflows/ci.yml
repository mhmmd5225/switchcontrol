name: Windows input validation

on:
  push:
    branches: [windows-input-validation-20261127]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Windows workspace tests
        run: cargo test --locked --workspace
      - name: Build Windows test package
        run: |
          cargo build --locked -p switchcontrol -p win-spike --bin switchcontrol --bin input-validation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path target/debug/switchcontrol.exe -DestinationPath SwitchControl-Windows-validated.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchControl-Windows-validated
          path: SwitchControl-Windows-validated.zip
      - name: Validate Win32 keyboard, pointer, and wheel
        run: |
          $result = & target/debug/input-validation.exe 2>&1
          $status = $LASTEXITCODE
          $result | Write-Output
          if ($status -ne 0) {
            Write-Output ("::error::Win32 input check failed. " + ($result -join " | "))
            exit $status
          }
          Write-Output ("::notice::" + ($result -join " | "))
